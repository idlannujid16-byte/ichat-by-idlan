
<!doctype html>
<html lang="ms">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>NOVA Live Whiteboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font: 14px system-ui, Arial, sans-serif;
    background: transparent;
    color: #e9f6ff;
}

main {
    padding: 15px;
    border: 1px solid #31536a;
    border-radius: 20px;

    background: linear-gradient(
        145deg,
        #111d2e,
        #0b1421
    );
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

strong {
    font-size: 18px;
}

.hint {
    color: #a0bdd1;
    font-size: 12px;
}

.board {
    position: relative;
    min-height: 270px;
    padding: 22px 20px;

    background: #f6f7fa;
    border-radius: 14px;
    margin: 13px 0;
    color: #21344c;

    box-shadow:
        inset 0 0 15px #c7d2df;
}

#stepTitle {
    font-weight: 700;
    font-size: 13px;
    color: #426380;
}

#written {
    font:
        600 clamp(19px, 4.4vw, 29px)/1.6
        ui-monospace, Consolas, monospace;

    white-space: pre-wrap;
    overflow-wrap: anywhere;

    margin-top: 26px;
    min-height: 90px;
}

#diagram {
    height: 94px;
    width: 100%;
    display: block;
    margin-top: 4px;
}

#narration {
    padding: 12px;

    background: #182f43;
    border: 1px solid #31506c;
    border-radius: 12px;

    line-height: 1.6;
    min-height: 64px;
}

.controls {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 12px;
}

button {
    padding: 10px 12px;
    border: 1px solid #496d85;
    border-radius: 12px;
    background: #263e55;
    color: #e9f6ff;
    cursor: pointer;
}

button:disabled {
    opacity: .4;
    cursor: default;
}

.primary {
    background: #1d6586;
    border-color: #5dbde8;
}

.danger {
    background: #66364a;
    border-color: #c08297;
}

#player {
    width: 100%;
    height: 35px;
    margin-top: 11px;
}

#interruptPanel {
    background: #142b3b;
    padding: 12px;
    border-radius: 12px;
    margin-top: 12px;
    border: 1px solid #3d7696;
}

textarea {
    width: 100%;
    min-height: 58px;
    border-radius: 9px;
    padding: 10px;

    border: 1px solid #57738d;
    background: #091725;
    color: white;

    font: inherit;
    resize: vertical;
}

#reply {
    white-space: pre-wrap;
    line-height: 1.7;
    padding: 12px;

    background: #224054;
    border-radius: 10px;
    margin-top: 10px;
}

#status {
    font-size: 12px;
    color: #81d9ff;
}

#bar {
    height: 4px;
    border-radius: 10px;
    background: #344b5e;
    margin: 12px 0;
}

#fill {
    height: 100%;
    width: 0;
    background: #6ae3ff;
    border-radius: 10px;
}

[hidden] {
    display: none !important;
}

</style>

</head>


<body>

<main>

    <div class="top">

        <div>

            <strong>
                ✎ NOVA Live Whiteboard
            </strong>

            <div
                class="hint"
                id="lessonTitle"
            >
                Select a lesson
            </div>

        </div>

        <span id="status">
            Ready
        </span>

    </div>


    <!-- DIGITAL BOARD -->

    <div class="board">

        <div id="stepTitle">
            Lesson step
        </div>

        <div id="written"></div>

        <svg
            id="diagram"
            viewBox="0 0 400 100"
            aria-label="Illustrative diagram"
        ></svg>

    </div>


    <!-- LESSON PROGRESS -->

    <div id="bar">

        <div id="fill"></div>

    </div>


    <!-- CURRENT NARRATION -->

    <div id="narration">

        NOVA will explain
        the current step here.

    </div>


    <audio
        id="player"
        controls
        hidden
    ></audio>


    <!-- LESSON CONTROLS -->

    <div class="controls">

        <button id="prev">
            ◀ Previous
        </button>

        <button
            id="play"
            class="primary"
        >
            ▶ Play lesson
        </button>

        <button id="next">
            Next ▶
        </button>

        <button
            id="interrupt"
            class="danger"
        >
            ✋ Interrupt / Ask
        </button>

    </div>


    <!-- STUDENT INTERRUPTION PANEL -->

    <div
        id="interruptPanel"
        hidden
    >

        <div
            class="hint"
            id="micState"
        >

            Explanation paused.
            Ask by voice or type below.

        </div>

        <div class="controls">

            <button id="record">
                🎙 Record question
            </button>

            <button
                id="stoprecord"
                hidden
            >
                ■ Send recording
            </button>

        </div>


        <textarea
            id="question"
            placeholder="Kenapa langkah ini digunakan?"
        ></textarea>


        <div class="controls">

            <button id="send">
                Ask NOVA
            </button>

            <button id="resume">
                Resume lesson
            </button>

        </div>


        <div
            id="reply"
            hidden
        ></div>

        <audio
            id="answerPlayer"
            controls
            hidden
        ></audio>

    </div>


    <div
        class="hint"
        style="margin-top:10px"
    >

        The board and spoken explanation
        are aligned step-by-step.
        Tap Interrupt to stop and ask.

    </div>

</main>


<script>

"use strict";


// =========================================
// STREAMLIT COMMUNICATION
// =========================================

const $ = id =>
    document.getElementById(id);

function notify(type, other = {}) {

    parent.postMessage({

        isStreamlitMessage: true,

        type,

        ...other

    }, "*");

}

function height() {

    notify(
        "streamlit:setFrameHeight",
        {
            height:
                document.body.scrollHeight + 6
        }
    );

}


// =========================================
// JAVASCRIPT STATE
// =========================================

let plan = null;

let planId = "";

let step = 0;

let playing = false;

let pausedForQuestion = false;

let seenReply = "";

let media = null;

let micStream = null;

let clip = [];

let recTimer = null;

const audio = $("player");

const answerAudio = $("answerPlayer");


function decodeBase64Audio(b64) {

    return (
        "data:audio/mpeg;base64,"
        + b64
    );

}

function current() {

    return plan?.steps?.[step] || null;

}


// =========================================
// DIAGRAM ENGINE
// =========================================

function diagram(kind) {

    const d = $("diagram");

    d.replaceChildren();

    const NS =
        "http://www.w3.org/2000/svg";

    function shape(
        name,
        attributes
    ) {

        const n =
            document.createElementNS(
                NS,
                name
            );

        for (
            const [key, val]
            of Object.entries(attributes)
        ) {

            n.setAttribute(
                key,
                String(val)
            );

        }

        d.appendChild(n);

        return n;

    }


    // GRAPH

    if (kind === "graph") {

        shape(
            "path",
            {
                d:
                    "M20 55 H380 "
                    + "M200 5 V95",

                stroke: "#8fa8b9",

                "stroke-width": 2,

                fill: "none"
            }
        );

        shape(
            "path",
            {
                d:
                    "M90 8 Q200 185 310 8",

                stroke: "#2d90b4",

                "stroke-width": 4,

                fill: "none"
            }
        );

    }


    // ELECTRIC CIRCUIT

    else if (kind === "circuit") {

        shape(
            "rect",
            {
                x: 80,
                y: 14,

                width: 240,
                height: 72,

                rx: 5,

                fill: "none",

                stroke: "#397e9c",

                "stroke-width": 3
            }
        );

        shape(
            "rect",
            {
                x: 178,
                y: 6,

                width: 45,
                height: 15,

                rx: 3,

                fill: "#e7ac68"
            }
        );

        shape(
            "circle",
            {
                cx: 80,
                cy: 50,

                r: 16,

                fill: "white",

                stroke: "#397e9c",

                "stroke-width": 3
            }
        );

    }


    // HISTORY TIMELINE

    else if (kind === "timeline") {

        shape(
            "path",
            {
                d: "M30 53 H375",

                stroke: "#397e9c",

                "stroke-width": 4
            }
        );

        for (
            const [x, label]
            of [
                [100, "1957"],
                [290, "1963"]
            ]
        ) {

            shape(
                "circle",
                {
                    cx: x,
                    cy: 53,
                    r: 12,

                    fill: "#397e9c"
                }
            );

            const t = shape(
                "text",
                {
                    x: x,
                    y: 28,

                    "text-anchor":
                        "middle",

                    fill: "#273d54",

                    "font-size": 16
                }
            );

            t.textContent = label;

        }

    }


    // ATOM MODEL

    else if (kind === "atom") {

        shape(
            "circle",
            {
                cx: 200,
                cy: 50,

                r: 18,

                fill: "#e99591"
            }
        );

        for (
            const r
            of [42, 70]
        ) {

            shape(
                "ellipse",
                {
                    cx: 200,
                    cy: 50,

                    rx: r,
                    ry: r * .5,

                    fill: "none",

                    stroke: "#3d83a3",

                    "stroke-width": 2
                }
            );

        }

    }


    // BIOLOGY CELL

    else if (kind === "cell") {

        shape(
            "ellipse",
            {
                cx: 200,
                cy: 50,

                rx: 125,
                ry: 43,

                fill: "#caeadd",

                stroke: "#478a7c",

                "stroke-width": 3
            }
        );

        shape(
            "circle",
            {
                cx: 190,
                cy: 50,

                r: 24,

                fill: "#a1a0d9"
            }
        );

    }


    // SIMPLE TEXT DIAGRAM

    else {

        const t = shape(
            "text",
            {
                x: 200,
                y: 55,

                "text-anchor":
                    "middle",

                fill: "#8096a9",

                "font-size": 13
            }
        );

        t.textContent =
            "NOVA ✦ Learn • Think • Practice";

    }

}


// =========================================
// DISPLAY CURRENT STEP
// =========================================

function showStep(
    index,
    auto = false
) {

    if (!plan) return;

    step = Math.min(

        Math.max(index, 0),

        plan.steps.length - 1
    );

    const s = current();

    audio.pause();

    audio.removeAttribute("src");

    audio.hidden = true;

    $("stepTitle").textContent =

        `STEP ${step + 1} OF `
        + `${plan.steps.length} · `
        + s.title;

    $("written").textContent = "";

    $("narration").textContent =
        s.say;

    diagram(
        s.kind
    );

    $("fill").style.width = "0";

    $("prev").disabled = (
        step === 0
    );

    $("next").disabled = (
        step === plan.steps.length - 1
    );

    $("play").textContent =
        "▶ Play this step";

    playing = false;

    if (auto) {
        playStep();
    }

    height();

}


// =========================================
// TYPING ANIMATION
// =========================================

function writeProgress(p) {

    const s = current();

    if (!s) return;

    const count = Math.max(

        0,

        Math.min(

            s.write.length,

            Math.floor(
                s.write.length * p
            )

        )
    );

    $("written").textContent =

        s.write.slice(0, count)

        + (
            count < s.write.length
            ? "▌"
            : ""
        );

    $("fill").style.width =

        `${Math.round(p * 100)}%`;

}


// =========================================
// PLAY VOICE WITH CURRENT STEP
// =========================================

async function playStep() {

    if (
        !current()
        || pausedForQuestion
    ) {
        return;
    }

    const s = current();

    // Resume existing playback.

    if (
        audio.paused

        && audio.src

        && audio.currentTime > 0

        && audio.currentTime < audio.duration
    ) {

        try {

            await audio.play();

            playing = true;

            $("status").textContent =
                "Speaking";

            $("play").textContent =
                "Ⅱ Pause";

            return;

        } catch (_) {}

    }

    audio.pause();

    audio.removeAttribute("src");

    audio.hidden = true;

    if (!s.audio) {

        writeProgress(1);

        $("status").textContent =
            "Voice unavailable";

        return;

    }

    audio.src = decodeBase64Audio(
        s.audio
    );

    audio.hidden = false;

    try {

        await audio.play();

        playing = true;

        $("status").textContent =
            "Speaking";

        $("play").textContent =
            "Ⅱ Pause";

    } catch (_) {

        writeProgress(1);

        $("status").textContent =
            "Tap audio Play";

    }

    height();

}


// =========================================
// PLAY / PAUSE / NEXT / PREVIOUS
// =========================================

$("play").onclick = () => {

    if (!audio.paused) {

        audio.pause();

        playing = false;

        $("status").textContent =
            "Paused";

        $("play").textContent =
            "▶ Resume";

    } else {

        playStep();

    }

};


$("prev").onclick = () => {

    showStep(
        step - 1
    );

};


$("next").onclick = () => {

    showStep(
        step + 1
    );

};


audio.addEventListener(
    "play",
    () => {

        playing = true;

        $("status").textContent =
            "Speaking";

        $("play").textContent =
            "Ⅱ Pause";

    }
);


audio.addEventListener(
    "timeupdate",
    () => {

        if (
            Number.isFinite(audio.duration)

            && audio.duration > 0
        ) {

            writeProgress(

                audio.currentTime
                / audio.duration

            );

        }

    }
);


audio.addEventListener(
    "ended",
    () => {

        playing = false;

        writeProgress(1);

        $("play").textContent =
            "▶ Replay";

        $("status").textContent =
            "Step complete";

        if (
            !pausedForQuestion

            && step < plan.steps.length - 1
        ) {

            setTimeout(
                () => {

                    if (
                        !pausedForQuestion

                        && !playing
                    ) {

                        showStep(
                            step + 1,
                            true
                        );

                    }

                },
                500
            );

        }

    }
);


// =========================================
// INTERRUPT NOVA
// =========================================

function interrupt() {

    pausedForQuestion = true;

    audio.pause();

    answerAudio.pause();

    $("interruptPanel").hidden =
        false;

    $("status").textContent =
        "Lesson paused — ask a question";

    $("play").disabled = true;

    height();

}


$("interrupt").onclick =
    interrupt;


// =========================================
// MICROPHONE RECORDING
// =========================================

function releaseMic() {

    clearTimeout(
        recTimer
    );

    recTimer = null;

    micStream?.getTracks().forEach(

        track => track.stop()

    );

    micStream = null;

    media = null;

    $("record").hidden = false;

    $("stoprecord").hidden = true;

}


// =========================================
// SEND QUESTION TO PYTHON
// =========================================

function emit(payload) {

    const id =

        crypto.randomUUID?.()

        || String(Date.now()) + Math.random();

    notify(
        "streamlit:setComponentValue",

        {
            value: {

                ...payload,

                id,

                plan_id: planId,

                step
            },

            dataType: "json"
        }
    );

    $("micState").textContent =
        "Asking NOVA...";

}


// =========================================
// STUDENT TYPED QUESTION
// =========================================

$("send").onclick = () => {

    const text = $("question").value.trim();

    if (!text) return;

    emit({

        type: "question",

        text
    });

    $("send").disabled = true;

};


// =========================================
// STUDENT SPOKEN QUESTION
// =========================================

$("record").onclick = async () => {

    try {

        micStream = await navigator
            .mediaDevices
            .getUserMedia({

                audio: {

                    echoCancellation: true,

                    noiseSuppression: true
                }

            });

        const types = [

            "audio/webm;codecs=opus",

            "audio/mp4",

            "audio/webm"
        ];

        const mime = types.find(

            type =>
                MediaRecorder.isTypeSupported(
                    type
                )

        );

        media = new MediaRecorder(

            micStream,

            mime
                ? {mimeType: mime}
                : {}

        );

        clip = [];

        media.ondataavailable = e => {

            if (e.data.size) {
                clip.push(e.data);
            }

        };

        media.onstop = async () => {

            const type =

                media?.mimeType

                || clip[0]?.type

                || "audio/webm";

            const blob = new Blob(

                clip,

                {type}

            );

            releaseMic();

            if (!blob.size) return;

            const data = await new Promise(

                (resolve, reject) => {

                    const reader =
                        new FileReader();

                    reader.onload = () => {

                        resolve(

                            String(reader.result)
                                .split(",")[1]

                        );

                    };

                    reader.onerror = reject;

                    reader.readAsDataURL(blob);

                }

            );

            emit({

                type: "question",

                audio: data,

                mime: type
            });

        };

        media.start();

        $("record").hidden = true;

        $("stoprecord").hidden = false;

        $("micState").textContent =

            "Recording... Tap Send recording "
            + "when finished.";

        recTimer = setTimeout(
            () => {

                if (
                    media?.state === "recording"
                ) {

                    media.stop();

                }

            },
            18000
        );

    } catch (_) {

        $("micState").textContent =

            "Microphone unavailable. "
            + "Type your question instead.";

        releaseMic();

    }

};


$("stoprecord").onclick = () => {

    if (
        media?.state === "recording"
    ) {

        media.stop();

    }

};


// =========================================
// RESUME LESSON
// =========================================

$("resume").onclick = () => {

    if (
        media?.state === "recording"
    ) {

        media.onstop = null;

        media.stop();

    }

    releaseMic();

    answerAudio.pause();

    pausedForQuestion = false;

    $("interruptPanel").hidden = true;

    $("send").disabled = false;

    $("micState").textContent =

        "Explanation paused. "
        + "Ask by voice or type below.";

    $("play").disabled = false;

    $("status").textContent =
        "Ready to continue";

    // Continue from current step.

    playStep();

    height();

};


// =========================================
// RECEIVE PYTHON DATA
// =========================================

window.addEventListener(
    "message",
    event => {

        if (

            event.source !== parent

            || event.data?.type
                !== "streamlit:render"

        ) {

            return;

        }

        const args =
            event.data.args || {};


        // NEW LESSON

        if (
            args.plan_id

            && args.plan_id !== planId
        ) {

            planId = args.plan_id;

            plan = args.plan || null;

            step = 0;

            pausedForQuestion = false;

            seenReply = "";

            $("lessonTitle").textContent =

                `${plan?.subject || ""}`
                + " • "
                + `${plan?.topic || ""}`;

            $("interruptPanel").hidden =
                true;

            $("play").disabled = false;

            showStep(
                0,
                false
            );

        }


        // ANSWER TO INTERRUPTION

        const reply = args.reply;

        if (
            reply?.id

            && reply.id !== seenReply
        ) {

            seenReply = reply.id;

            pausedForQuestion = true;

            $("reply").hidden = false;

            $("reply").textContent =
                reply.text || "";

            $("send").disabled = false;

            $("question").value = "";

            $("micState").textContent =

                "NOVA answered. "
                + "Resume when ready.";

            if (reply.audio) {

                answerAudio.src =

                    decodeBase64Audio(
                        reply.audio
                    );

                answerAudio.hidden = false;

                answerAudio.play().catch(
                    () => {}
                );

            }

            height();

        }

        height();

    }
);


// =========================================
// PRIVACY CLEANUP
// =========================================

document.addEventListener(
    "visibilitychange",
    () => {

        if (document.hidden) {

            audio.pause();

            if (
                media?.state === "recording"
            ) {

                media.onstop = null;

                media.stop();

            }

            releaseMic();

        }

    }
);


window.addEventListener(
    "pagehide",
    releaseMic
);


// =========================================
// INITIALIZE
// =========================================

notify(
    "streamlit:componentReady",
    {
        apiVersion: 1
    }
);

height();

if (window.ResizeObserver) {

    new ResizeObserver(
        height
    ).observe(
        document.body
    );

}

</script>

</body>
</html>
