
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA V18 Robot Voice</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:transparent;
  color:#e9f8ff;
  font:14px system-ui,Arial;
}
main{
  padding:20px 12px;
  border:1px solid #335671;
  border-radius:24px;
  text-align:center;
  background:radial-gradient(
    ellipse at 50% 35%,
    #173b55,#091321 75%
  );
}
h1{
  letter-spacing:8px;
  margin:0;
}
.subtitle{
  color:#9dbbd0;
  font-size:11px;
  letter-spacing:2px;
  margin:8px 0;
}
#robot{
  display:block;
  width:min(100%,320px);
  margin:auto;
  cursor:pointer;
  touch-action:none;
  user-select:none;
  -webkit-touch-callout:none;
}
.head{
  animation:float 4s ease-in-out infinite;
}
.eyes{
  transform-box:fill-box;
  transform-origin:center;
  animation:blink 5s infinite;
}
@keyframes float{
  50%{transform:translateY(-7px)}
}
@keyframes blink{
  0%,45%,50%,100%{transform:scaleY(1)}
  47%{transform:scaleY(.1)}
}
canvas{
  display:block;
  width:min(100%,420px);
  height:75px;
  margin:auto;
}
#status{
  color:#83e4ff;
  font-weight:700;
  letter-spacing:3px;
  font-size:13px;
}
#hint{
  color:#a9c3d6;
  font-size:12px;
  margin:12px 0;
  min-height:34px;
}
button{
  padding:11px 19px;
  color:#eaf8ff;
  background:#1d405b;
  border:1px solid #5b9ec2;
  border-radius:22px;
  cursor:pointer;
}
button:disabled{opacity:.45}
#end{
  background:#513043;
  border-color:#b97a95;
}
audio{
  width:min(100%,390px);
  margin:12px auto;
}
#privacy{
  color:#9cb9cc;
  font-size:11px;
  margin:13px 0;
}
footer{
  color:#7799b0;
  font-size:10px;
  letter-spacing:1px;
  margin-top:12px;
}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){
  .head,.eyes{animation:none}
}
</style>
</head>

<body>
<main>

<h1>NOVA</h1>
<div class="subtitle">
  INTELLIGENT VOICE ASSISTANT
</div>

<svg id="robot" viewBox="0 0 320 235">
<defs>
  <linearGradient id="shell" x1="0" y1="0"
    x2="0" y2="1">
    <stop stop-color="#f6fbff"/>
    <stop offset="1" stop-color="#8da8bf"/>
  </linearGradient>
  <linearGradient id="visor" x1="0" y1="0"
    x2="1" y2="1">
    <stop stop-color="#07131f"/>
    <stop offset="1" stop-color="#15354b"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<ellipse cx="160" cy="224" rx="88" ry="5"
  fill="#4dbdff" opacity=".15"/>

<g class="head">
  <rect x="27" y="87" width="27"
    height="60" rx="13" fill="#7495b2"/>
  <rect x="266" y="87" width="27"
    height="60" rx="13" fill="#7495b2"/>

  <rect x="44" y="28" width="232"
    height="180" rx="70"
    fill="url(#shell)" stroke="#dcefff"/>

  <rect x="59" y="45" width="202"
    height="144" rx="53"
    fill="url(#visor)" stroke="#3a5f7a"
    stroke-width="3"/>

  <path d="M128 36 H192"
    stroke="#76e3ff" stroke-width="4"
    stroke-linecap="round"/>

  <g class="eyes" fill="#83edff" filter="url(#glow)">
    <rect x="98" y="86" width="34"
      height="40" rx="17"/>
    <rect x="188" y="86" width="34"
      height="40" rx="17"/>
  </g>

  <path id="mouth"
    d="M140 148 Q160 167 180 148"
    fill="none" stroke="#83edff"
    stroke-width="5" stroke-linecap="round"
    filter="url(#glow)"/>

  <text x="160" y="199"
    fill="#42637c" font-size="10"
    letter-spacing="4"
    text-anchor="middle">NOVA</text>
</g>
</svg>

<canvas id="wave"></canvas>

<div id="status">STANDBY</div>

<div id="hint">
  Hold robot for one second to start Voice Chat.
</div>

<button id="start">
  🎙 Start Voice Chat
</button>

<button id="end" hidden>
  ■ End Voice Chat
</button>

<audio id="player" controls hidden></audio>

<div id="privacy">Microphone off</div>

<footer>
  NOVA V18 • DEVELOPED BY IDLAN
</footer>
</main>

<script>
"use strict";

const $ = id=>document.getElementById(id);
const robot=$("robot");
const player=$("player");
const canvas=$("wave");
const ctx=canvas.getContext("2d");

let args={};
let session="";
let active=false;
let starting=false;
let busy=false;

let state="STANDBY";
let generation=0;
let stream=null;
let ac=null;
let micSource=null;
let micAnalyser=null;
let micData=null;
let outAnalyser=null;
let outData=null;

let capture=null;
let encoding=false;

let waiting="";
let baseline="";
let seenReply="";

let holdTimer=null;
let holdStart=0;
let energy=0;
let clock=0;

const colors={
  STANDBY:"#83e4ff",
  LISTENING:"#65ffc4",
  THINKING:"#b5a1ff",
  SPEAKING:"#83e4ff",
  PAUSED:"#ffcc7b",
  ERROR:"#ff809c"
};

function host(type,extra={}){
  parent.postMessage({
    isStreamlitMessage:true,
    type,
    ...extra
  },"*");
}

function resize(){
  host("streamlit:setFrameHeight",{
    height:document.body.scrollHeight+6
  });
}

function status(value,hint){
  state=value;

  $("status").textContent=value;
  $("status").style.color=
    colors[value]||colors.STANDBY;

  const hints={
    STANDBY:"Hold robot for one second to start.",
    LISTENING:"NOVA is listening. Speak naturally.",
    THINKING:"NOVA is processing your question.",
    SPEAKING:"NOVA is speaking.",
    PAUSED:"Press Play to hear NOVA.",
    ERROR:"Check microphone or connection."
  };

  $("hint").textContent=hint||hints[value];
  $("start").hidden=active||starting;
  $("start").disabled=busy||Boolean(waiting);
  $("end").hidden=!(active||starting);

  const micOn=stream?.getAudioTracks().some(
    t=>t.enabled&&t.readyState==="live"
  );

  $("privacy").textContent=
    micOn?"● Microphone on":"Microphone off";
  $("privacy").style.color=
    micOn?"#65ffc4":"#9cb9cc";

  resize();
}

async function prepareAudio(){
  const AudioContextClass=
    window.AudioContext||
    window.webkitAudioContext;

  if(!AudioContextClass){
    throw Error("Web Audio unavailable");
  }

  if(!ac){
    ac=new AudioContextClass();
  }

  if(!outAnalyser){
    outAnalyser=ac.createAnalyser();
    outAnalyser.fftSize=1024;
    outData=new Float32Array(1024);

    const outputSource=
      ac.createMediaElementSource(player);

    outputSource.connect(outAnalyser);
    outAnalyser.connect(ac.destination);
  }

  if(ac.state==="suspended"){
    await ac.resume();
  }
}

function enableMic(value){
  stream?.getAudioTracks().forEach(
    t=>t.enabled=value
  );

  $("privacy").textContent=
    value&&stream
      ?"● Microphone on"
      :"Microphone off";
}

function releaseMic(){
  stream?.getTracks().forEach(t=>t.stop());

  try{
    micSource?.disconnect();
  }catch(e){}

  stream=null;
  micSource=null;
  micAnalyser=null;
  micData=null;

  enableMic(false);
}

function stopVoice(){
  generation++;

  active=false;
  starting=false;
  encoding=false;

  if(capture){
    capture.discard=true;

    try{
      if(capture.rec.state!=="inactive"){
        capture.rec.stop();
      }
    }catch(e){}

    capture=null;
  }

  player.pause();
  releaseMic();

  energy=0;
  status("STANDBY","Voice Chat stopped.");
}

async function startVoice(){
  if(
    active||starting||busy||
    waiting||!session
  )return;

  const token=++generation;
  starting=true;

  status(
    "STANDBY",
    "Requesting microphone permission..."
  );

  try{
    if(
      !navigator.mediaDevices?.getUserMedia||
      !window.MediaRecorder
    ){
      throw Error("Recording unsupported");
    }

    await prepareAudio();

    const input=
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true,
          channelCount:1
        }
      });

    if(token!==generation){
      input.getTracks().forEach(t=>t.stop());
      return;
    }

    stream=input;
    micSource=ac.createMediaStreamSource(stream);
    micAnalyser=ac.createAnalyser();
    micAnalyser.fftSize=1024;
    micData=new Float32Array(1024);
    micSource.connect(micAnalyser);

    stream.getAudioTracks().forEach(t=>{
      t.addEventListener("ended",()=>{
        if(token===generation){
          stopVoice();
          status("ERROR","Microphone disconnected.");
        }
      });
    });

    player.pause();
    starting=false;
    active=true;
    beginRecording();

  }catch(e){
    if(token!==generation)return;
    stopVoice();
    status(
      "ERROR",
      "Allow microphone access or use manual voice."
    );
  }
}

function finishRecording(discard=false){
  if(!capture||capture.stopping)return;

  capture.discard ||= discard;
  capture.stopping=true;

  if(!discard){
    enableMic(false);
    status("THINKING");
  }

  if(capture.rec.state!=="inactive"){
    capture.rec.stop();
  }
}

function beginRecording(){
  if(
    !active||busy||waiting||
    encoding||capture||!stream||
    !player.paused||state==="PAUSED"
  )return;

  enableMic(true);

  const token=generation;

  try{
    const formats=[
      "audio/webm;codecs=opus",
      "audio/mp4",
      "audio/ogg;codecs=opus",
      "audio/webm"
    ];

    const mime=formats.find(t=>
      MediaRecorder.isTypeSupported(t)
    );

    const rec=new MediaRecorder(
      stream,
      mime?{mimeType:mime}:{}
    );

    const current={
      rec,
      chunks:[],
      started:performance.now(),
      first:0,
      last:0,
      stopping:false,
      discard:false
    };

    capture=current;

    rec.ondataavailable=e=>{
      if(e.data.size){
        current.chunks.push(e.data);
      }
    };

    rec.onerror=()=>{
      if(token===generation){
        stopVoice();
        status("ERROR","Recording failed.");
      }
    };

    rec.onstop=async()=>{
      if(capture===current){
        capture=null;
      }

      if(token!==generation||!active)return;

      if(current.discard||!current.first){
        if(
          active&&!busy&&!waiting&&
          state==="LISTENING"
        ){
          beginRecording();
        }
        return;
      }

      encoding=true;
      enableMic(false);
      status("THINKING");

      try{
        const type=
          rec.mimeType||
          current.chunks[0]?.type||
          "audio/webm";

        const blob=new Blob(
          current.chunks,{type}
        );

        if(!blob.size){
          throw Error("Empty recording");
        }

        const encoded=await new Promise(
          (resolve,reject)=>{
            const reader=new FileReader();

            reader.onload=()=>resolve(
              String(reader.result).split(",")[1]
            );

            reader.onerror=reject;
            reader.readAsDataURL(blob);
          }
        );

        if(token!==generation||!active)return;

        waiting=
          crypto.randomUUID?.()||
          String(Date.now()+Math.random());

        baseline=args.reply_id||"";
        encoding=false;

        host("streamlit:setComponentValue",{
          value:{
            type:"voice",
            id:waiting,
            session_id:session,
            audio:encoded,
            mime:type
          },
          dataType:"json"
        });

      }catch(e){
        if(token===generation){
          stopVoice();
          status("ERROR","Unable to send recording.");
        }
      }
    };

    rec.start();
    status("LISTENING");

  }catch(e){
    stopVoice();
    status("ERROR","Unable to record.");
  }
}

// Detect silence
const vadTimer=setInterval(()=>{
  if(
    !active||state!=="LISTENING"||
    !capture||capture.stopping
  )return;

  const current=capture;
  const now=performance.now();

  if(
    rms(micAnalyser,micData)>
    (Number(args.threshold)||.018)
  ){
    if(!current.first){
      current.first=now;
    }

    current.last=now;
  }

  const silence=
    Number(args.silence_ms)||1500;

  if(
    current.first&&
    now-current.last>=silence
  ){
    finishRecording(
      current.last-current.first<150
    );

  }else if(
    now-current.started>=30000
  ){
    finishRecording(!current.first);

  }else if(
    !current.first&&
    now-current.started>=15000
  ){
    finishRecording(true);
  }
},60);

function rms(analyser,data){
  if(!analyser||!data)return 0;

  analyser.getFloatTimeDomainData(data);

  let total=0;
  for(const value of data){
    total+=value*value;
  }

  return Math.sqrt(total/data.length);
}

async function playReply(){
  try{
    await prepareAudio();
    await player.play();
  }catch(e){
    status(
      "PAUSED",
      "Autoplay blocked. Press Play below."
    );
  }
}

function loadReply(encoded,autoplay){
  player.pause();

  if(!encoded){
    player.hidden=true;
    player.removeAttribute("src");

    if(active){
      beginRecording();
    }else{
      status("STANDBY");
    }

    return;
  }

  enableMic(false);

  player.src=
    "data:audio/mpeg;base64,"+encoded;

  player.hidden=false;

  if(autoplay){
    status("PAUSED");
    playReply();
  }else{
    status(
      "STANDBY",
      "Press Play to hear NOVA."
    );
  }

  resize();
}

player.addEventListener("play",()=>{
  status("SPEAKING");
  finishRecording(true);
  enableMic(false);
});

player.addEventListener("pause",()=>{
  if(!player.ended&&state==="SPEAKING"){
    status(
      active?"PAUSED":"STANDBY"
    );
  }
});

player.addEventListener("ended",()=>{
  status(
    active?"LISTENING":"STANDBY"
  );

  if(active){
    const token=generation;

    setTimeout(()=>{
      if(active&&token===generation){
        beginRecording();
      }
    },350);
  }
});

window.addEventListener("message",event=>{
  if(
    event.source!==parent||
    event.data?.type!=="streamlit:render"
  )return;

  args=event.data.args||{};

  const incoming=args.session_id||"";

  if(session&&session!==incoming){
    stopVoice();

    waiting="";
    baseline="";
    seenReply="";

    player.hidden=true;
    player.removeAttribute("src");
  }

  session=incoming;
  busy=!!args.busy;

  const reply=args.reply_id||"";

  if(
    waiting&&
    args.ack_id===waiting&&
    !busy&&
    (args.error||reply!==baseline)
  ){
    waiting="";

    if(args.error&&reply===baseline){
      stopVoice();
      status("ERROR",args.error);

    }else{
      seenReply=reply;
      loadReply(args.audio||"",active);
    }

  }else if(busy||waiting){
    finishRecording(true);
    enableMic(false);
    status("THINKING");

  }else if(reply&&reply!==seenReply){
    seenReply=reply;
    loadReply(args.audio||"",active);

  }else if(
    active&&!capture&&!encoding&&
    state!=="PAUSED"&&
    state!=="SPEAKING"
  ){
    beginRecording();
  }

  resize();
});

// Press and hold robot
function toggleVoice(){
  if(active||starting){
    stopVoice();
  }else{
    startVoice();
  }
}

robot.addEventListener("pointerdown",e=>{
  if(e.button!==0||holdTimer)return;

  e.preventDefault();

  try{
    robot.setPointerCapture(e.pointerId);
  }catch(e){}

  if(!active&&!busy){
    prepareAudio().catch(()=>{});
  }

  holdStart=performance.now();

  holdTimer=setTimeout(()=>{
    holdStart=0;
    toggleVoice();
  },1000);
});

function cancelHold(){
  clearTimeout(holdTimer);
  holdTimer=null;
  holdStart=0;
}

[
  "pointerup",
  "pointercancel",
  "lostpointercapture"
].forEach(name=>{
  robot.addEventListener(name,cancelHold);
});

robot.oncontextmenu=e=>e.preventDefault();

$("start").onclick=startVoice;
$("end").onclick=stopVoice;

// Audio-reactive animation
function draw(){
  requestAnimationFrame(draw);

  if(document.hidden)return;

  const width=canvas.clientWidth;
  const height=canvas.clientHeight;
  const dpr=Math.min(devicePixelRatio||1,2);

  if(
    canvas.width!==Math.round(width*dpr)||
    canvas.height!==Math.round(height*dpr)
  ){
    canvas.width=Math.round(width*dpr);
    canvas.height=Math.round(height*dpr);
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,width,height);

  let level=0;

  if(state==="LISTENING"){
    level=rms(micAnalyser,micData);
  }else if(state==="SPEAKING"){
    level=rms(outAnalyser,outData);
  }

  energy+=(
    Math.min(1,level*6)-energy
  )*.3;

  clock+=.045;

  const color=
    colors[state]||colors.STANDBY;

  for(let layer=0;layer<3;layer++){
    ctx.beginPath();

    for(let x=0;x<=width;x++){
      const p=x/Math.max(width,1);
      const envelope=Math.sin(Math.PI*p);

      const y=
        height/2+
        envelope*
        Math.sin(p*24-clock*3+layer)*
        (3+energy*height*.55);

      if(x===0){
        ctx.moveTo(x,y);
      }else{
        ctx.lineTo(x,y);
      }
    }

    ctx.strokeStyle=color;
    ctx.globalAlpha=1-layer*.25;
    ctx.lineWidth=2;
    ctx.shadowColor=color;
    ctx.shadowBlur=8;
    ctx.stroke();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  const opening=2+energy*18;

  $("mouth").setAttribute(
    "d",
    state==="SPEAKING"
      ?`M140 148 Q160 ${148-opening} 180 148
        Q160 ${148+opening} 140 148`
      :"M140 148 Q160 167 180 148"
  );
}

requestAnimationFrame(draw);

// Privacy
document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden&&(active||starting)){
      stopVoice();
    }
  }
);

window.addEventListener("pagehide",()=>{
  clearInterval(vadTimer);
  stopVoice();
  ac?.close().catch(()=>{});
});

// Initialize component
host(
  "streamlit:componentReady",
  {apiVersion:1}
);

resize();

if(window.ResizeObserver){
  new ResizeObserver(resize).observe(
    document.body
  );
}
</script>
</body>
</html>
